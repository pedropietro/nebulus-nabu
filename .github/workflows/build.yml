name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Nabu is built from source (pedropietro/nabu) so the build does not depend on JitPack.
      - name: Checkout Nabu
        uses: actions/checkout@v4
        with:
          repository: pedropietro/nabu
          ref: 565204cd36cbb40966ba06b7aab657bd431c0b8f
          path: nabu

      - name: Install Nabu into the local Maven repository
        run: mvn -B -q -f nabu/pom.xml install -DskipTests

      - name: Build and test nebulus-nabu
        run: mvn -B -Pnabu-local verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  # Checks the default build, which resolves Nabu through JitPack (com.github.pedropietro:nabu).
  jitpack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile against Nabu from JitPack
        run: mvn -B test-compile
