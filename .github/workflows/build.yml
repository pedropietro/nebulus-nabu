name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Nabu is built from source (pedropietro/nabu) so the build does not depend on JitPack.
      - name: Checkout Nabu
        uses: actions/checkout@v4
        with:
          repository: pedropietro/nabu
          ref: 565204cd36cbb40966ba06b7aab657bd431c0b8f
          path: nabu

      - name: Install Nabu into the local Maven repository
        run: mvn -B -q -f nabu/pom.xml install -DskipTests

      - name: Build, test and install nebulus-nabu
        run: mvn -B -Pnabu-local install

      # The Quick Start (docs/quickstart.md) must keep working exactly as documented.
      - name: "Quick Start: offline CIDs"
        working-directory: examples/quickstart
        run: |
          mvn -B -q -Plocal compile exec:java -Dexec.mainClass=quickstart.QuickStart | tee quickstart.out
          grep -q "folder       -> bafybeif4ubfbkzlur7gc2xn4gazuyugmxozdftyne3xalzqku6olwgpwdi \[hello.txt, note.txt\]" quickstart.out
          grep -q "note.txt says: Nebulus keeps this private" quickstart.out

      - name: "Quick Start: two local nodes"
        working-directory: examples/quickstart
        timeout-minutes: 5
        run: |
          mvn -B -q -Plocal compile exec:java -Dexec.mainClass=quickstart.LocalNetwork | tee local.out
          grep -q "Bob reads:   a private hello from Alice" local.out

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  # Windows: CRLF checkouts (core.autocrlf), workspace on D: with the temp folder on C:.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Checkout Nabu
        uses: actions/checkout@v4
        with:
          repository: pedropietro/nabu
          ref: 565204cd36cbb40966ba06b7aab657bd431c0b8f
          path: nabu

      - name: Install Nabu into the local Maven repository
        run: mvn -B -q -f nabu/pom.xml install -DskipTests

      - name: Build and test nebulus-nabu
        run: mvn -B -Pnabu-local verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-windows
          path: target/surefire-reports
          if-no-files-found: ignore

  # The install path users follow: everything from JitPack, including this commit of nebulus-nabu.
  jitpack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile against Nabu from JitPack
        run: mvn -B test-compile
      - name: "Quick Start from JitPack (JitPack builds new commits on demand, so retry)"
        working-directory: examples/quickstart
        run: |
          version="${GITHUB_SHA::10}"
          for attempt in 1 2 3 4 5; do
            if mvn -B -q -U compile exec:java -Dnebulus.version="$version" -Dexec.mainClass=quickstart.QuickStart | tee quickstart.out \
               && grep -q "note.txt says: Nebulus keeps this private" quickstart.out; then
              exit 0
            fi
            echo "attempt $attempt failed; waiting for JitPack"
            sleep 120
          done
          exit 1
